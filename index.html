    <script>
      // Load platform config asynchronously so iOS and mobile browsers do not freeze or throw security errors
      (function() {
        function applyThemeColor(hexColor) {
          if (!hexColor) return;
          var hex = hexColor.replace('#', '');
          if (hex.length === 6) {
            var r = parseInt(hex.substring(0,2), 16) / 255;
            var g = parseInt(hex.substring(2,4), 16) / 255;
            var b = parseInt(hex.substring(4,6), 16) / 255;
            var max = Math.max(r, g, b), min = Math.min(r, g, b);
            var h = 0, s = 0, l = (max + min) / 2;
            if (max !== min) {
              var d = max - min;
              s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
              switch (max) {
                case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                case g: h = ((b - r) / d + 2) / 6; break;
                case b: h = ((r - g) / d + 4) / 6; break;
              }
            }
            var hDeg = Math.round(h * 360);
            var sPct = Math.round(s * 100) + '%';
            var lPct = Math.round(l * 100) + '%';
            var hslStr = hDeg + ' ' + sPct + ' ' + lPct;
            
            var root = document.documentElement;
            root.style.setProperty('--primary', hslStr);
            root.style.setProperty('--accent', hslStr);
            root.style.setProperty('--ring', hslStr);
            root.style.setProperty('--sidebar-primary', hslStr);
            root.style.setProperty('--sidebar-ring', hslStr);
            root.style.setProperty('--theme-primary-hex', hexColor);
          }
        }

        function resolveLogoUrl(url) {
          if (!url) return '';
          if (window.location.protocol === 'https:' && url.indexOf('http://') === 0) {
            url = url.replace('http://', 'https://');
          }
          if (/^https?:\/\//i.test(url)) {
            return url;
          }
          if (url.charAt(0) === '/') {
            if (baseUrl && url.indexOf(baseUrl) !== 0) {
              return baseUrl + url;
            }
            return url;
          }
          return (baseUrl || '') + '/' + url;
        }

        try {
          var pathParts = window.location.pathname.split('/');
          var rfdriveIndex = -1;
          for (var i = 0; i < pathParts.length; i++) {
            if (pathParts[i].indexOf('rfdrive') === 0) {
              rfdriveIndex = i;
              break;
            }
          }
          var baseUrl = '';
          if (rfdriveIndex !== -1) {
            baseUrl = '/' + pathParts.slice(0, rfdriveIndex + 1).join('/');
          }

          // Point manifest to dynamic PHP endpoint
          var manifestLink = document.getElementById('manifestLink');
          if (manifestLink) manifestLink.href = (baseUrl || '') + '/php/manifest.php';

          // Apply cached config instantly to prevent white/blue flashes
          var cached = localStorage.getItem('platform_config');
          if (cached) {
            var config = JSON.parse(cached);
            if (config) {
              if (config.cor_primaria) applyThemeColor(config.cor_primaria);
              if (config.nome_plataforma) {
                document.title = config.slogan ? config.nome_plataforma + ' | ' + config.slogan : config.nome_plataforma;
                var appTitle = document.getElementById('appTitle');
                if (appTitle) appTitle.setAttribute('content', config.nome_plataforma);
              }
              if (config.logo_url) {
                var cacheLogo = resolveLogoUrl(config.logo_url);
                var fav = document.getElementById('favicon');
                if (fav) fav.href = cacheLogo;
                var appleIcons = document.querySelectorAll('link[rel="apple-touch-icon"]');
                for (var i = 0; i < appleIcons.length; i++) appleIcons[i].href = cacheLogo;
              }
            }
          }

          var xhr = new XMLHttpRequest();
          xhr.open('POST', (baseUrl || '') + '/php/api.php', true);
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
              try {
                var data = JSON.parse(xhr.responseText);
                if (data && data.length > 0) {
                  var logoUrl = data[0].logo_url;
                  var platformName = data[0].nome_plataforma;
                  var corPrimaria = data[0].cor_primaria;

                  // Save to cache
                  localStorage.setItem('platform_config', JSON.stringify(data[0]));

                  if (corPrimaria) {
                    applyThemeColor(corPrimaria);
                  }

                  if (logoUrl) {
                    var resolvedLogo = resolveLogoUrl(logoUrl);
                    // Make it absolute for social media crawlers
                    var absoluteLogo = resolvedLogo;
                    if (!/^https?:\/\//i.test(absoluteLogo)) {
                      absoluteLogo = window.location.origin + (absoluteLogo.charAt(0) === '/' ? '' : '/') + absoluteLogo;
                    }

                    var favicon = document.getElementById('favicon');
                    if (favicon) favicon.href = resolvedLogo;

                    var appleIcons = document.querySelectorAll('link[rel="apple-touch-icon"]');
                    for (var i = 0; i < appleIcons.length; i++) appleIcons[i].href = resolvedLogo;

                    var ogImage = document.querySelector('meta[property="og:image"]');
                    if (ogImage) ogImage.setAttribute('content', absoluteLogo);
                    var twitterImage = document.querySelector('meta[name="twitter:image"]');
                    if (twitterImage) twitterImage.setAttribute('content', absoluteLogo);
                  }

                  if (platformName) {
                    var appTitle = document.getElementById('appTitle');
                    if (appTitle) appTitle.setAttribute('content', platformName);
                    document.title = data[0].slogan ? platformName + ' | ' + data[0].slogan : platformName;

                    var ogTitle = document.querySelector('meta[property="og:title"]');
                    if (ogTitle) ogTitle.setAttribute('content', platformName);
                    var ogDesc = document.querySelector('meta[property="og:description"]');
                    if (ogDesc) ogDesc.setAttribute('content', platformName + (data[0].slogan ? ' - ' + data[0].slogan : ''));
                    var twitterTitle = document.querySelector('meta[name="twitter:title"]');
                    if (twitterTitle) twitterTitle.setAttribute('content', platformName);
                  }
                }
              } catch(e) {}
            }
          };
          xhr.send(JSON.stringify({
            action:'select', table:'config_plataforma',
            columns:'logo_url,nome_plataforma,slogan,cor_primaria', limit:1
          }));
        } catch(e) {}
      })();
    </script>
    <script>
      // Must be in <head> BEFORE module scripts to catch load failures
      window.__appLoaded = false;
      window.onerror = function(msg, src, line, col, err) {
        if (window.__appLoaded) return;
        document.addEventListener('DOMContentLoaded', function() {
          var el = document.getElementById('root');
          if (el) el.innerHTML = '<div style="padding:24px;font:14px monospace;color:#ff6b6b;background:#111;min-height:100vh;word-break:break-all;"><h2 style="color:#fff">Erro</h2><p>'+msg+'</p><p>'+src+':'+line+'</p>'+(err&&err.stack?'<pre style="white-space:pre-wrap">'+err.stack+'</pre>':'')+'</div>';
        });
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.addEventListener('DOMContentLoaded', function() {
          var el = document.getElementById('root');
          if (el) el.innerHTML = '<div style="padding:24px;font:14px monospace;color:#ff6b6b;background:#111;min-height:100vh;word-break:break-all;"><h2 style="color:#fff">Erro (Promise)</h2><p>'+(e.reason&&e.reason.message?e.reason.message:String(e.reason))+'</p>'+(e.reason&&e.reason.stack?'<pre style="white-space:pre-wrap">'+e.reason.stack+'</pre>':'')+'</div>';
        });
      });
      setTimeout(function() {
        if (window.__appLoaded) return;
        console.warn("System: App failed to load within 8s timeout");
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="padding:24px;font:14px monospace;color:#ffa500;background:#111;min-height:100vh;"><h2 style="color:#fff">App não carregou</h2><p>O JavaScript pode não estar sendo executado ou os arquivos não foram encontrados.</p><p>Verifique o console (F12) para erros de 404 ou CORS.</p><p>URL: '+location.href+'</p></div>';
        }
      }, 8000);
    </script>

  <body>
    <script>
      // SPA redirect restore — works with 404.html
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
